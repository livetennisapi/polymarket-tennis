version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      pip-root-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /examples/claude-code-watcher
    schedule:
      interval: weekly
      day: monday
    groups:
      pip-claude-code-watcher-minor-patch:
        update-types: [minor, patch]
