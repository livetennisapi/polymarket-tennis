name: publish

# Publish to PyPI via OIDC Trusted Publishing (no API token stored).
# Requires a Trusted Publisher configured on PyPI for this project:
#   owner=livetennisapi, repo=<this repo>, workflow=publish.yml, environment=pypi.
# Triggers when a GitHub Release is published.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # OIDC token for Trusted Publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
